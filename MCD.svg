<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="entityGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e3f2fd" />
    </linearGradient>
    
    <linearGradient id="associationGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e5f5" />
    </linearGradient>
    
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#455a64"/>
    </marker>
  </defs>
  
  <style>
    <![CDATA[
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
    
    text { font-family: 'Roboto', sans-serif; }
    
    /* Styles des boites */
    .entity {
      fill: url(#entityGradient);
      stroke: #1565c0;
      stroke-width: 2;
      filter: url(#shadow);
      rx: 2; /* Coins peu arrondis pour les entités */
    }
    
    .association {
      fill: url(#associationGradient);
      stroke: #7b1fa2;
      stroke-width: 2;
      filter: url(#shadow);
      rx: 30; /* Forme ovale pour les associations */
    }
    
    /* Styles des textes */
    .entity-text {
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
      fill: #0d47a1;
      dominant-baseline: middle;
    }
    
    .association-text {
      font-size: 13px;
      font-weight: 700;
      text-anchor: middle;
      fill: #4a148c;
      dominant-baseline: middle;
    }
    
    .relation-text {
      font-size: 12px;
      font-weight: 500;
      text-anchor: middle;
      fill: #e65100;
    }
    
    .cardinality {
      font-size: 11px;
      font-weight: 400;
      text-anchor: middle;
      fill: #455a64;
    }
    
    /* Lignes de connexion */
    .connector {
      stroke: #546e7a;
      stroke-width: 1.5;
      fill: none;
    }
    
    .title { font-size: 24px; font-weight: 700; fill: #37474f; text-anchor: middle; }
    .subtitle { font-size: 14px; font-weight: 400; fill: #78909c; text-anchor: middle; }
    ]]>
  </style>
  
  <rect x="250" y="20" width="600" height="60" fill="#fafafa" stroke="#cfd8dc" rx="5"/>
  <text x="500" y="45" class="title">MCD - Salle de Sport</text>
  <text x="500" y="68" class="subtitle">Modèle Conceptuel de Données</text>

  <g transform="translate(50, 350)">
    <rect width="140" height="60" class="entity"/>
    <text x="70" y="30" class="entity-text">MEMBRE</text>
  </g>

  <g transform="translate(400, 100)">
    <rect width="160" height="50" class="association"/>
    <text x="80" y="25" class="association-text">SOUSCRIPTION</text>
  </g>

  <g transform="translate(400, 230)">
    <rect width="160" height="50" class="association"/>
    <text x="80" y="25" class="association-text">PAIEMENT</text>
  </g>

  <g transform="translate(400, 480)">
    <rect width="160" height="50" class="association"/>
    <text x="80" y="25" class="association-text">SESSION</text>
  </g>

  <g transform="translate(400, 600)">
    <rect width="160" height="50" class="association"/>
    <text x="80" y="25" class="association-text">ACCÈS</text>
  </g>

  <g transform="translate(750, 100)">
    <rect width="140" height="60" class="entity"/>
    <text x="70" y="30" class="entity-text">ABONNEMENT</text>
  </g>

  <g transform="translate(750, 475)">
    <rect width="140" height="60" class="entity"/>
    <text x="70" y="30" class="entity-text">COACH</text>
  </g>

  <path d="M 190 350 L 250 350 L 250 125 L 400 125" class="connector"/>
  <text x="210" y="340" class="cardinality">(1,n)</text>
  <text x="380" y="115" class="cardinality">(1,1)</text>
  <text x="300" y="120" class="relation-text">souscrit</text>

  <line x1="560" y1="125" x2="750" y2="125" class="connector"/>
  <text x="580" y="115" class="cardinality">(1,1)</text>
  <text x="730" y="115" class="cardinality">(1,n)</text>
  <text x="655" y="115" class="relation-text">concerne</text>

  <path d="M 190 365 L 280 365 L 280 255 L 400 255" class="connector"/>
  <text x="210" y="360" class="cardinality">(1,n)</text>
  <text x="380" y="245" class="cardinality">(0,n)</text>
  <text x="320" y="250" class="relation-text">effectue</text>
  
  <line x1="480" y1="230" x2="480" y2="150" class="connector" style="stroke-dasharray: 4;"/>
  <text x="490" y="215" class="cardinality">(1,1)</text>
  <text x="490" y="165" class="cardinality">(1,n)</text>
  <text x="510" y="190" class="relation-text" fill="#666">lié à</text>

  <path d="M 190 395 L 250 395 L 250 505 L 400 505" class="connector"/>
  <text x="210" y="415" class="cardinality">(1,n)</text>
  <text x="380" y="495" class="cardinality">(0,n)</text>
  <text x="300" y="500" class="relation-text">réserve</text>

  <line x1="560" y1="505" x2="750" y2="505" class="connector"/>
  <text x="580" y="495" class="cardinality">(n,1)</text>
  <text x="730" y="495" class="cardinality">(1,n)</text>
  <text x="655" y="495" class="relation-text">animée par</text>

  <path d="M 190 380 L 220 380 L 220 625 L 400 625" class="connector"/>
  <text x="230" y="580" class="cardinality">(1,n)</text>
  <text x="380" y="615" class="cardinality">(0,n)</text>
  <text x="300" y="620" class="relation-text">enregistre</text>

</svg>